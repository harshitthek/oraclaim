[DEFAULT]
# Your Oracle Cloud User OCID (found in OCI Console -> User Settings)
user=ocid1.user.oc1..aaaaaaaaEXAMPLEUSEROCID

# Fingerprint of the API Signing RSA Key uploaded to Oracle Console
fingerprint=00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff

# Path to the private key on the server (e.g. /home/opc/.oci/oci_api_key.pem)
key_file=./ssh-key.key

# Your Tenancy OCID (found in OCI Console -> Tenancy Details)
tenancy=ocid1.tenancy.oc1..aaaaaaaahhpEXAMPLESECRET

# Target Region (e.g. ap-mumbai-1, ap-hyderabad-1, us-ashburn-1, eu-frankfurt-1)
region=ap-mumbai-1
