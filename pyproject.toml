[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-arm-smart-claimer"
version = "1.0.0"
description = "Production-grade, asynchronous dual-worker Oracle Cloud Always Free ARM auto-claimer with AIMD rate learning and top-of-hour surge."
authors = [{ name = "Harshit", email = "harshit@worldtree.local" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "oci>=2.115.0",
    "urllib3>=1.26.0",
    "cryptography>=38.0.0"
]

[project.scripts]
oci-claim = "src.cli:main"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
